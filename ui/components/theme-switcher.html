<!-- ui/components/theme-switcher.html -->
<div class="theme-switcher">
    <div class="theme-header">
        <h3 data-i18n="themeSettings">Theme Settings</h3>
        <span class="theme-current" data-i18n="currentTheme">Current: System</span>
    </div>

    <div class="theme-options">
        <label class="theme-option" data-theme="auto">
            <input type="radio" name="theme" value="auto" class="theme-radio">
            <div class="theme-card">
                <div class="theme-preview auto-preview">
                    <div class="preview-half light-half"></div>
                    <div class="preview-half dark-half"></div>
                    <div class="preview-icon">&#9681;</div>
                </div>
                <div class="theme-info">
                    <span class="theme-name" data-i18n="autoTheme">Auto (System)</span>
                    <span class="theme-description" data-i18n="autoThemeDesc">
                        Follows your system theme
                    </span>
                </div>
            </div>
        </label>

        <label class="theme-option" data-theme="light">
            <input type="radio" name="theme" value="light" class="theme-radio">
            <div class="theme-card">
                <div class="theme-preview light-preview">
                    <div class="preview-icon">&#9728;</div>
                </div>
                <div class="theme-info">
                    <span class="theme-name" data-i18n="lightTheme">Light</span>
                    <span class="theme-description" data-i18n="lightThemeDesc">
                        Clean and bright interface
                    </span>
                </div>
            </div>
        </label>

        <label class="theme-option" data-theme="dark">
            <input type="radio" name="theme" value="dark" class="theme-radio">
            <div class="theme-card">
                <div class="theme-preview dark-preview">
                    <div class="preview-icon">&#127769;</div>
                </div>
                <div class="theme-info">
                    <span class="theme-name" data-i18n="darkTheme">Dark</span>
                    <span class="theme-description" data-i18n="darkThemeDesc">
                        Easy on the eyes
                    </span>
                </div>
            </div>
        </label>
    </div>

    <!--
        Блок «Advanced Settings» удалён 2026-09-10. Кнопка не была привязана ни к чему, поэтому блок
        за ней (помеченный hidden) не раскрывался никогда, а два контрола внутри - «запоминать выбор
        темы» и скорость анимации - не читал ни один участок кода. Пользователь видел кнопку, которая
        на нажатие не отвечает; это неотличимо от сломанного расширения.
    -->
</div>
